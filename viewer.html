<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 데일리 브리핑</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#6a7380; --line:#e3e6ea;
  --accent:#2457d6; --accent-soft:#e8eefc; --top:#cfd3dd; --band:#e4e7ee; --band-line:#c3cad8; --band-ink:#111418; --up:#d2452f; --down:#2563c9; --hot:#e8590c;
  --chip:#f0f2f5; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111418; --panel:#1a1e24; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b313a;
    --accent:#7aa2ff; --accent-soft:#1f2a44; --top:#cfd3dd; --band:#e4e7ee; --band-line:#c3cad8; --band-ink:#111418; --up:#ff7a63; --down:#6fa3ff; --hot:#ff9a4d; --chip:#242a32; --shadow:none; }
}
*{box-sizing:border-box}
/* 글꼴: KoPub 돋움체 (한국출판인회의 무료 서체, 눈누 CDN). 불러오기 전/실패 시 기본 한글 글꼴 사용 */
@font-face{font-family:"KoPubDotum";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/KoPubDotumMedium.woff") format("woff");font-weight:normal;font-style:normal;font-display:swap}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "KoPubDotum","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
/* 최상단 제목 영역: 세레니티 블루 + 검은 글씨 */
.topband{background:var(--top);color:var(--band-ink);border-bottom:1px solid #a9b2c6}
.topband .brand small{color:#1f2a3d}
.topband .btn,.topband select{background:#fff;color:#111418;border-color:#a9b2c6}
.topband .btn.admin{color:#0b3d91;border-color:#0b3d91}
.bar{max-width:1120px;margin:0 auto;padding:26px 16px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:26px;letter-spacing:-.6px;line-height:1.25;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);margin-top:2px}
.datenav{display:flex;gap:6px;align-items:center}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;max-width:min(360px,52vw)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
.card{--pad:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:var(--pad);box-shadow:var(--shadow);margin-bottom:16px}
/* 블록 상단 제목 띠: 코발트 블루 */
.card > h2:first-child,.card > h3:first-child,.card.method > summary{margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 14px;padding:11px var(--pad);background:var(--band);color:var(--band-ink);border-bottom:2px solid var(--band-line);border-radius:11px 11px 0 0}
.card > h2:first-child a,.card > h3:first-child a{color:inherit}
.card > h2:first-child .sub,.card > h3:first-child .src{color:var(--band-ink);opacity:.7}
.card.method:not([open]) > summary{margin-bottom:calc(-1 * var(--pad));border-bottom:0;border-radius:11px}
.kwgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kwgrid > .card{margin:0;--pad:14px}
.card > h3:first-child{font-size:14.5px;line-height:1.4}
/* 블록 안 하위 블록은 색 띠 없이 제목 + 얇은 구분선만 */
.kwgrid > .card > h3:first-child{background:transparent;border-bottom:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 12px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.kpi span{color:var(--ink);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.narr{font-size:15.5px;line-height:1.8;margin:0 0 14px}
ol.keysent{margin:0;padding-left:20px}
ol.keysent li{margin:6px 0}
.src{color:var(--muted);font-size:12.5px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip.static{cursor:default}
.badge{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px;background:var(--chip);color:var(--muted)}
.badge.hot{background:var(--hot);color:#fff}
.badge.cov{background:var(--accent-soft);color:var(--accent)}
.art{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:14px}
.art:first-child{border-top:0}
.art .rk{font-weight:800;font-size:18px;color:var(--muted);width:26px;flex:none;text-align:right}
.art .body{min-width:0;flex:1}
.art .t{font-weight:700;font-size:16px;line-height:1.45}
.art .meta{color:var(--muted);font-size:12.5px;margin:3px 0}
.art .snip{color:var(--muted);font-size:14px;margin:4px 0 0}
details.others summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}
details.others ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.sigs{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.sig{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sig .signame{flex:none;width:76px;color:var(--ink);font-weight:700;font-size:13px}
.sig .end{flex:none;font-size:12px}
.sig .siglab{flex:none;width:150px;color:var(--ink);font-weight:600}
.sig .siglab small{font-weight:400;color:var(--muted)}
.pos{color:var(--up)} .neg{color:var(--down)}
.sig .end.pos,.sig .siglab.pos{color:var(--up)} .sig .end.neg,.sig .siglab.neg{color:var(--down)}
.evh{font-weight:700;font-size:13px;margin:10px 0 2px}
.method dl{margin:0} .method dt{font-weight:700;margin-top:14px} .method dt:first-child{margin-top:0}
.method summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:16px}
.method summary::-webkit-details-marker{display:none}
.method summary .more{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600}
.method summary .more::after{content:" ▾"}
.method[open] summary .more{font-size:0}
.method[open] summary .more::after{content:"접기 ▴";font-size:13px}

.method dd{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.75}
.method dd b{color:var(--ink);font-weight:600} .method ul{margin:4px 0;padding-left:18px}
.method table.mt{margin:8px 0;font-size:13px} .method table.mt td,.method table.mt th{white-space:normal}
.sigbar{position:relative;flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down),var(--line) 50%,var(--up))}
.sigbar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.kwcard h3{margin:0 0 6px;font-size:15px}
.kwcard p{margin:6px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.hbar{height:8px;border-radius:4px;background:var(--accent);opacity:.75}
.sel{color:var(--accent);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty code{background:var(--chip);padding:2px 6px;border-radius:6px}
.note{color:var(--muted);font-size:13px;line-height:1.7}
.scroll{overflow-x:auto}
svg text{fill:var(--ink);font-size:11px}
.searchbox{display:flex;gap:8px;margin-bottom:12px}
.searchbox input{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px}
.hm td{text-align:center;padding:4px;font-size:11.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s}
.toast.on{opacity:1}
#tip{position:absolute;z-index:20;max-width:min(380px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:13.5px}
#tip .tip-h{font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
#tip ul{margin:6px 0 0;padding-left:16px;max-height:280px;overflow:auto}
#tip li{margin:4px 0;line-height:1.45}
.tipword{cursor:pointer}
.chip.tipword:hover{background:var(--band);color:var(--band-ink)}
td .tipword{border-bottom:1px dashed var(--muted)}
.treemap{position:relative;width:100%;aspect-ratio:100/62;border-radius:8px;overflow:hidden;container-type:inline-size}
.tm{position:absolute;box-sizing:border-box;border:2px solid var(--panel);border-radius:6px;padding:2px 3px;color:#111418;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.15;transition:filter .15s}
.tm span{font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.tm small{opacity:.7}
.tm:hover{filter:brightness(.92)}
.chip.uniq{font-weight:700;color:var(--ink);border-color:var(--accent)}
.ptable td,.ptable th{vertical-align:top}
.ptable .chips{gap:4px}
details.pd{border-top:1px solid var(--line);padding:8px 0;margin:0}
details.pd summary{color:var(--ink);font-size:14px}
details.pd ol,details.pd ul{margin:8px 0 4px}
.pday{font-weight:700;margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pol{padding:10px 0 12px;border-bottom:1px dashed var(--line)}
.pol .t{font-weight:700;font-size:15.5px;line-height:1.45;display:block;margin:4px 0}
.pol ul.pts{margin:4px 0;padding-left:18px;font-size:14px}
.pol ul.pts li{margin:2px 0}
.badge.src-molit{background:#1f6f5c;color:#fff}
.badge.src-fsc{background:#7a4cc2;color:#fff}
.searchbox select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px}
.btn.admin{border-color:var(--accent);color:var(--accent);font-weight:600}
dialog.trig{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(360px,calc(100vw - 32px))}
dialog.trig::backdrop{background:rgba(0,0,0,.35)}
dialog.trig h3{margin:0 0 6px;font-size:16px}
dialog.trig input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;margin:10px 0}
dialog.trig .row{display:flex;gap:8px;justify-content:flex-end}
dialog.trig .st{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 0;white-space:pre-line}
@media (max-width:600px){ .art .rk{width:18px;font-size:15px} .brand{font-size:22px;width:100%} .datenav{width:100%} .datenav select{flex:1;min-width:0;width:0;max-width:none} .art .t{font-size:15px} .card{--pad:14px} .kwgrid{grid-template-columns:1fr} .sig{flex-wrap:wrap} .sig .signame{width:100%} .sig .siglab{width:100%} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="topband"><div class="bar">
    <div class="brand">부동산 데일리 브리핑<small id="collected">-</small></div>
    <div class="datenav">
      <button class="btn" id="prev" title="이전 날짜">◀</button>
      <select id="dateSel"></select>
      <button class="btn" id="next" title="다음 날짜">▶</button>
      <button class="btn" id="latest">최신</button>
      <button class="btn admin" id="collectNow" hidden title="GitHub에서 뉴스를 지금 새로 수집합니다 (관리자 전용)">뉴스 수집하기</button>
    </div>
  </div></div>
  <nav class="tabs" id="tabs">
    <button data-tab="brief">종합 브리핑</button>
    <button data-tab="analysis">키워드 연관도 분석</button>
    <button data-tab="news">키워드별 뉴스</button>
    <button data-tab="policy">부동산 정책</button>
    <button data-tab="trend">추이</button>
    <button data-tab="search">과거 기사 검색</button>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<div id="tip" hidden></div>

<script>
/* 웹에서는 매번 최신 목록을 받도록 캐시 방지 파라미터를 붙임 (파일로 열 때는 그대로) */
window.IS_WEB = /^https?:$/.test(location.protocol);
document.write('<script src="data/index.js' + (IS_WEB ? '?v=' + Date.now() : '') + '"><\/script>');
/* "지금 수집" 버튼용 암호화된 GitHub 토큰 (비밀번호로만 복호화 가능, 없으면 버튼은 Actions 페이지로 안내) */
if (IS_WEB) document.write('<script src="trigger-key.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
"use strict";
/* ================================================================ 데이터 로딩 */
const INDEX = (window.NEWS_INDEX || []).slice().sort((a, b) => b.date.localeCompare(a.date));
const cache = {};
const waiters = {};
window.__newsDay = d => { cache[d.date] = d; (waiters[d.date] || []).forEach(f => f(d)); delete waiters[d.date]; };
function loadDay(date) {
  if (cache[date]) return Promise.resolve(cache[date]);
  return new Promise((resolve, reject) => {
    (waiters[date] = waiters[date] || []).push(resolve);
    const s = document.createElement('script');
    const meta = INDEX.find(x => x.date === date);
    s.src = 'data/days/' + date + '.js' + (window.IS_WEB && meta ? '?v=' + encodeURIComponent(meta.collectedAt) : '');
    s.onerror = () => reject(new Error(date + ' 데이터를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}
/* 최근 limit 일치만 불러옴 (없으면 전체). INDEX 는 최신순 */
async function loadAll(onProgress, limit) {
  const list = limit ? INDEX.slice(0, limit) : INDEX;
  const out = [];
  for (let i = 0; i < list.length; i++) {
    try { out.push(await loadDay(list[i].date)); } catch (e) { /* 손상 파일 건너뜀 */ }
    if (onProgress) onProgress(i + 1, list.length);
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/* ================================================================ 탑재형 NLP (오프라인) */
const JOSA = ['에서는','으로는','에서도','에게서','이라는','이라고','까지','부터','에서','에게','으로','보다','처럼','라는','하는','했다','한다','된다','됐다','되는','이다','은','는','이','가','을','를','의','에','와','과','도','만','로'];
const STOP = new Set(('기자 뉴스 오늘 지난 올해 이번 관련 위해 대한 통해 따르면 밝혔다 있다 없다 것으로 지난해 이후 가운데 대해 최근 사진 '
  + '연합뉴스 뉴시스 종합 단독 속보 포토 영상 이날 한편 또한 있는 같은 위한 대비 기준 경우 정도 오전 오후 현재 부동산 아파트 주택 시장 '
  + '정부 이상 이하 가장 다시 모두 계획 예정 발표 진행 전망 우리 그는 하지만 이어 것은 것이 때문 등을 등의 바로 지금 만에 문제 개월 '
  + '아냐 무슨 어떻게 대상 가능성 나서 필요 말했다 했다고 이라며 라며 이라고 강조 설명 언급 지적 주장 것으 따라 반면 실제 넘어 데다 함께 특히 다만 여전히 이는 해당 각각 보인다 나타났다 전년 동기 만원 억원 조원').split(' '));
function tokens(text) {
  const out = [];
  for (let w of (String(text).match(/[가-힣]{2,}|[A-Za-z]{2,}/g) || [])) {
    for (const j of JOSA) { if (w.length > j.length + 1 && w.endsWith(j)) { w = w.slice(0, -j.length); break; } }
    w = w.toUpperCase();
    if (w.length >= 2 && !STOP.has(w)) out.push(w);
  }
  return out;
}
function splitSentences(article) {
  const res = [];
  if (article.title && !/(\.\.\.|…)\s*$/.test(article.title)) res.push({ text: article.title, art: article, isTitle: true });
  const sn = String(article.snippet || '').replace(/…|\.{3,}/g, ' ¶ ');
  for (let s of sn.split(/(?<=다\.|요\.|[!?])\s+|¶/)) {
    s = s.trim();
    if (s.length >= 25 && s.length <= 200 && /(다|요)\.?$/.test(s)) res.push({ text: s.replace(/\.?$/, '.'), art: article });
  }
  return res;
}
function jaccard(a, b) { if (!a.size || !b.size) return 0; let i = 0; a.forEach(x => { if (b.has(x)) i++; }); return i / (a.size + b.size - i); }

/* TextRank + 개인화 PageRank(기사 화제도를 텔레포트 가중치로 사용) + MMR 중복 제거 */
function overlap(a, b) { if (!a.size || !b.size) return 0; let i = 0; a.forEach(x => { if (b.has(x)) i++; }); return i / Math.min(a.size, b.size); }
function bigrams(s) { const k = String(s).replace(/[^가-힣A-Za-z0-9]/g, ''); const b = new Set(); for (let i = 0; i < k.length - 1; i++) b.add(k.slice(i, i + 2)); return b; }
function textRank(items, k, groupKey) {
  const n = items.length;
  if (!n) return [];
  const toks = items.map(it => new Set(tokens(it.text)));
  const W = Array.from({ length: n }, () => new Float64Array(n));
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    let inter = 0; toks[i].forEach(x => { if (toks[j].has(x)) inter++; });
    if (!inter) continue;
    const w = inter / (Math.log(toks[i].size + 1) + Math.log(toks[j].size + 1));
    W[i][j] = W[j][i] = w; out[i] += w; out[j] += w;
  }
  let pers = items.map(it => (it.weight || 1));
  const ps = pers.reduce((a, b) => a + b, 0); pers = pers.map(x => x / ps);
  let r = new Float64Array(n).fill(1 / n);
  for (let it = 0; it < 50; it++) {
    const nr = new Float64Array(n);
    for (let i = 0; i < n; i++) { if (!out[i]) continue; const ri = r[i] / out[i]; for (let j = 0; j < n; j++) if (W[i][j]) nr[j] += ri * W[i][j]; }
    for (let j = 0; j < n; j++) nr[j] = 0.15 * pers[j] + 0.85 * nr[j];
    r = nr;
  }
  const order = [...Array(n).keys()].sort((a, b) => r[b] - r[a]);
  const bg = items.map(it => bigrams(it.text));
  const picked = [], usedGroups = new Set();
  for (const i of order) {
    if (picked.length >= k) break;
    if (toks[i].size < 3) continue;
    const g = groupKey ? groupKey(items[i]) : null;
    if (g != null && usedGroups.has(g)) continue;
    if (picked.some(p => overlap(toks[p], toks[i]) > 0.3 || overlap(bg[p], bg[i]) > 0.3)) continue;
    picked.push(i); if (g != null) usedGroups.add(g);
  }
  return picked.map(i => ({ ...items[i], rank: r[i] }));
}

/* ================================================================ 시장 지표 (규칙 기반 판정기)
   한 구절 안에서 "대상(가격·물량·거래)"과 "방향(오름/내림, 늘어남/줄어듦)" 표현을 짝지어 판정한다.
   지표는 시장(매매·전월세) × 종류(가격·물량·거래) = 6개. 근거 기사가 MIN_EVIDENCE(3)건 미만인 지표는 표시하지 않는다.
   - 가격: 높아지면 상승(+), 낮아지면 하락(−)
   - 물량·거래: 많아지면 증가(+), 적어지면 감소(−) */
const KINDS = { 가격: { pos: '상승', neg: '하락' }, 물량: { pos: '증가', neg: '감소' }, 거래: { pos: '증가', neg: '감소' } };
const ASPECTS = [['매매', '가격'], ['매매', '물량'], ['매매', '거래'], ['전월세', '가격'], ['전월세', '물량'], ['전월세', '거래']]
  .map(([market, kind]) => ({ id: market + ' ' + kind, market, kind, ...KINDS[kind] }));
// [표현, 종류, 시장(null이면 문맥으로 판단)] - 긴 표현부터 매칭
const TARGETS = [
  ['아파트 가격', '가격', '매매'], ['아파트값', '가격', '매매'], ['집값', '가격', '매매'], ['매매가격', '가격', '매매'], ['매매가', '가격', '매매'],
  ['주택가격', '가격', '매매'], ['주택 가격', '가격', '매매'], ['분양가', '가격', '매매'], ['낙찰가율', '가격', '매매'], ['호가', '가격', '매매'],
  ['전세가격', '가격', '전월세'], ['전세 가격', '가격', '전월세'], ['전셋값', '가격', '전월세'], ['전세가', '가격', '전월세'],
  ['월셋값', '가격', '전월세'], ['월세', '가격', '전월세'], ['임대료', '가격', '전월세'], ['시세', '가격', null], ['가격', '가격', null], ['상승률', '가격', null], ['상승폭', '가격', null],
  ['입주물량', '물량', null], ['입주 물량', '물량', null], ['미분양', '물량', '매매'], ['인허가', '물량', '매매'], ['착공', '물량', '매매'],
  ['매물', '물량', null], ['물량', '물량', null], ['공급', '물량', null],
  ['거래량', '거래', null], ['거래 건수', '거래', null], ['거래건수', '거래', null], ['매매 거래', '거래', '매매'], ['매매거래', '거래', '매매'],
  ['매매액', '거래', '매매'], ['거래액', '거래', null], ['경쟁률', '거래', '매매'], ['거래', '거래', null]
];
// 대상과 방향이 한 단어에 들어 있는 표현
const SELF = [['신고가', '가격', '매매', 1], ['최고가', '가격', null, 1], ['전세난', '물량', '전월세', -1], ['역전세', '가격', '전월세', -1], ['깡통전세', '가격', '전월세', -1], ['거래절벽', '거래', null, -1]];
const POS = ['상승', '오름', '올라', '오른', '올랐', '오르', '급등', '반등', '강세', '들썩', '치솟', '뛰었', '뛴', '뛰어', '폭등', '상향', '높아', '높였',
  '증가', '늘어', '늘었', '늘려', '늘린', '급증', '확대', '쌓여', '쌓이', '적체', '많아', '회복', '활발', '최대', '돌파', '↑'];
const NEG = ['하락', '내림', '내려', '떨어', '급락', '약세', '하향', '낮아', '낮춰', '폭락', '꺾', '빠졌', '빠지', '감소', '줄어', '줄었', '줄여', '축소',
  '급감', '씨 마르', '씨가 마르', '품귀', '최저', '위축', '적어', '뚝', '반토막', '실종', '가뭄', '절벽', '바닥', '↓'];
const RENT_CTX = /전세|월세|전월세|임대차|세입자|임차/;
const OPINION = /가능성|우려|전망|경고|예상|관측|조짐|기대|할 것|될 것|수 있|불안|\?/;
const NEGATION = /^.{0,6}?(않|없|안 |못 )/;
const STOPPED = /^.{0,6}?(멈|그치|그쳐|벗어|제동)/;

function findAll(text, list, getWord) {
  const hits = [];
  for (const item of list) {
    const w = getWord ? getWord(item) : item;
    let i = text.indexOf(w);
    while (i >= 0) { hits.push({ pos: i, end: i + w.length, item }); i = text.indexOf(w, i + 1); }
  }
  // 긴 표현 우선, 겹치는 짧은 표현 제거
  hits.sort((a, b) => (b.end - b.pos) - (a.end - a.pos));
  const kept = [];
  for (const h of hits) if (!kept.some(k => h.pos < k.end && k.pos < h.end)) kept.push(h);
  return kept.sort((a, b) => a.pos - b.pos);
}
function clauseSignals(clause) {
  const out = [];
  const opinion = OPINION.test(clause.replace(/전망지수|분양전망|전망치/g, ''));
  const marketOf = m => m || (RENT_CTX.test(clause) ? '전월세' : '매매');
  for (const h of findAll(clause, SELF, s => s[0])) {
    out.push({ id: marketOf(h.item[2]) + ' ' + h.item[1], sign: h.item[3], w: opinion ? 0.4 : 1, opinion });
  }
  const targets = findAll(clause, TARGETS, t => t[0]).filter(t => !SELF.some(s => clause.slice(Math.max(0, t.pos - 3), t.end + 3).includes(s[0])));
  if (!targets.length) return out;
  const dirs = findAll(clause, [...POS.map(w => [w, 1]), ...NEG.map(w => [w, -1])], d => d[0]);
  for (const d of dirs) {
    // 가장 가까운 대상 (대상이 앞에 오는 "집값 상승" 형태를 우선, 최대 20자)
    let best = null, bestDist = 21;
    for (const t of targets) {
      const dist = t.end <= d.pos ? d.pos - t.end : t.pos >= d.end ? t.pos - d.end + 4 : 0;
      if (dist < bestDist) { best = t; bestDist = dist; }
    }
    if (!best) continue;
    let sign = d.item[1], w = opinion ? 0.4 : 1;
    const after = clause.slice(d.end, d.end + 8);
    if (NEGATION.test(after)) sign = -sign;
    else if (STOPPED.test(after)) { sign = -sign; w *= 0.5; }
    out.push({ id: marketOf(best.item[2]) + ' ' + best.item[1], sign, w, opinion });
  }
  return out;
}
function articleClauses(a) {
  const text = (a.title || '') + ' ¶ ' + (a.snippet || '');
  return text.split(/¶|[,…·;\n]|\.{2,}|(?<=다)\.\s*|\s(?:반면|하지만|그러나|다만|한편)\s/).map(s => s.trim()).filter(s => s.length >= 4);
}
/* 기사별로 지표마다 방향을 하나로 모은 뒤(같은 기사 중복 집계 방지), 보도량 가중 평균 */
function marketSignals(arts) {
  const acc = {};
  ASPECTS.forEach(a => acc[a.id] = { ...a, num: 0, den: 0, n: 0, ev: [] });
  for (const a of arts) {
    const per = {};
    for (const c of articleClauses(a)) for (const s of clauseSignals(c)) {
      (per[s.id] = per[s.id] || { sum: 0, ev: [] }).sum += s.sign * s.w;
      per[s.id].ev.push({ clause: c, sign: s.sign, opinion: s.opinion });
    }
    const aw = Math.log(2 + (a.coverage || 1));
    for (const id in per) {
      if (!acc[id] || per[id].sum === 0) continue;
      const vote = Math.max(-1, Math.min(1, per[id].sum));
      acc[id].num += vote * aw; acc[id].den += aw; acc[id].n++;
      acc[id].ev.push({ art: a, vote, clause: per[id].ev.find(e => Math.sign(e.sign) === Math.sign(vote)).clause, opinion: per[id].ev.every(e => e.opinion) });
    }
  }
  return ASPECTS.map(a => { const r = acc[a.id]; r.v = r.den ? r.num / r.den : 0; r.ev.sort((x, y) => (y.art.coverage || 0) - (x.art.coverage || 0)); return r; });
}
const MIN_EVIDENCE = 3; // 근거 기사 3건 미만 지표는 숨김
const shownSig = r => r.n >= MIN_EVIDENCE;
function aspectLabel(r) { return r.v > 0.15 ? r.pos + ' 우세' : r.v < -0.15 ? r.neg + ' 우세' : '혼조'; }

/* 형용사·동사 활용형 걸러내기 (형태소 분석기 없이 끝 글자로 판단, 명사 예외 목록 포함) */
const PRED_END = ['야', '봐', '져', '워', '려', '줘', '했', '됐', '된', '될', '운', '은', '는', '던', '게', '며', '다', '와', '네', '죠', '까', '한', '할', '럽', '롭', '겠', '잖'];
const NOUN_OK = new Set(['분야', '시야', '제한', '권한', '상한', '하한', '기한', '시한', '은행', '금은', '행운', '기운', '최소한', '한도', '부담', '바다', '기와', '게임', '나다', '은퇴']);
function isPredicate(w) {
  if (NOUN_OK.has(w) || /^[A-Z]+$/.test(w)) return false;
  return PRED_END.some(e => w.endsWith(e)) || /(스러|하게|해야|해서|하며|하고|에서|으로)$/.test(w);
}

/* 트리맵: 값(빈도)에 비례하는 면적의 상자로 영역을 채움 (squarified 알고리즘) */
function treemapLayout(items, W, H) {
  const total = items.reduce((s, i) => s + i.v, 0) || 1, k = W * H / total;
  const nodes = items.map(i => ({ ...i, a: i.v * k })), out = [];
  let x = 0, y = 0, w = W, h = H, row = [];
  const worst = (r, len) => { const s = r.reduce((a, n) => a + n.a, 0), mx = Math.max(...r.map(n => n.a)), mn = Math.min(...r.map(n => n.a)); return Math.max(len * len * mx / (s * s), s * s / (len * len * mn)); };
  const place = r => {
    const s = r.reduce((a, n) => a + n.a, 0);
    if (w >= h) { const rw = s / h; let yy = y; r.forEach(n => { const rh = n.a / rw; out.push({ ...n, x, y: yy, w: rw, h: rh }); yy += rh; }); x += rw; w -= rw; }
    else { const rh = s / w; let xx = x; r.forEach(n => { const rw = n.a / rh; out.push({ ...n, x: xx, y, w: rw, h: rh }); xx += rw; }); y += rh; h -= rh; }
  };
  for (let i = 0; i < nodes.length;) {
    const len = Math.min(w, h);
    if (!row.length || worst([...row, nodes[i]], len) <= worst(row, len)) row.push(nodes[i++]); else { place(row); row = []; }
  }
  if (row.length) place(row);
  return out;
}
/* 상자 안에 글자가 다 안 들어가면 들어갈 때까지 글자 크기를 줄임 (최소 6px) */
function fitTreemaps(root) {
  (root || document).querySelectorAll(".tm span").forEach(s => {
    s.style.fontSize = "";
    let px = parseFloat(getComputedStyle(s).fontSize);
    const box = s.parentElement, room = box.clientWidth - 6;
    while ((s.scrollWidth > room || box.scrollHeight > box.clientHeight + 1) && px > 6) { px -= 0.5; s.style.fontSize = px + "px"; }
  });
}
let fitTimer = null;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => fitTreemaps(), 150); });

function treemapHtml(items) {
  items = items.filter(i => i.v > 0).sort((a, b) => b.v - a.v);
  if (!items.length) return '<p class="note">이슈어가 없습니다.</p>';
  const W = 100, H = 62, maxV = items[0].v, minV = items[items.length - 1].v;
  return `<div class="treemap">${treemapLayout(items, W, H).map(r => {
    const t = maxV === minV ? 1 : (r.v - minV) / (maxV - minV);
    // 글자 크기를 상자 크기에 맞춤 (cqw = 트리맵 너비의 1%). 한글 한 글자 ≈ 1em
    const bw = r.w / W * 100, bh = r.h / W * 100, len = [...r.word].length;
    const fs = Math.min(bw / (len * 1.05 + 0.8), bh * 0.42, 6.5);
    const showNum = bh > fs * 2.1;
    return `<div class="tm tipword" ${r.tip || ''} style="left:${r.x / W * 100}%;top:${r.y / H * 100}%;width:${bw}%;height:${r.h / H * 100}%;background:hsl(222,${30 + 15 * t}%,${90 - 20 * t}%)">
      <span style="font-size:max(7px,${fs.toFixed(2)}cqw)">${esc(r.word)}</span>${showNum ? `<small style="font-size:max(7px,${Math.min(fs * 0.6, 2.6).toFixed(2)}cqw)">${r.v}</small>` : ''}</div>`;
  }).join('')}</div>`;
}

function topTerms(arts, k, exclude) {
  const df = new Map();
  for (const a of arts) new Set(tokens(a.title + ' ' + (a.snippet || ''))).forEach(t => df.set(t, (df.get(t) || 0) + 1));
  return [...df.entries()].filter(([t, c]) => c >= 2 && !(exclude || new Set()).has(t)).sort((a, b) => b[1] - a[1]).slice(0, k);
}

/* 시장 지표 판정 재료: 선별 기사 + 그날 표본 기사 제목(키워드 선정용으로 모은 약 350건). 같은 제목은 한 번만 */
const normTitle = s => String(s || '').replace(/[^가-힣A-Za-z0-9]/g, '');
function signalPool(days) {
  const seen = new Set(), out = [];
  for (const d of days) {
    for (const a of d.keywords.flatMap(k => k.articles)) { const k = normTitle(a.title); if (!seen.has(k)) { seen.add(k); out.push(a); } }
    for (const x of (d.analysis && d.analysis.sampleArts) || []) {
      const k = normTitle(x.t); if (!seen.has(k)) { seen.add(k); out.push({ title: x.t, url: x.u || '', press: x.p || '', coverage: 1 }); }
    }
  }
  return out;
}
function summarizeDay(day) {
  const all = [];
  for (const kw of day.keywords) for (const a of kw.articles) all.push({ ...a, keyword: kw.keyword });
  const sentItems = [];
  for (const a of all) for (const s of splitSentences(a)) sentItems.push({ ...s, weight: (a.score || 1) * (s.isTitle ? 1.3 : 1) });
  const key = textRank(sentItems, 5, it => it.art.keyword);
  const sig = marketSignals(signalPool([day]));
  const kwSet = new Set(day.keywords.map(k => k.keyword.toUpperCase()));
  const terms = topTerms(all, 14, kwSet);
  const perKw = day.keywords.map(kw => {
    const items = [];
    for (const a of kw.articles) for (const s of splitSentences(a)) items.push({ ...s, weight: (a.score || 1) * (s.isTitle ? 1.3 : 1) });
    const cov = kw.articles.reduce((s, a) => s + (a.coverage || 1), 0);
    return { kw, sents: textRank(items, 2), sig: marketSignals(kw.articles), terms: topTerms(kw.articles, 6, new Set([kw.keyword.toUpperCase()])), coverage: cov };
  });
  const press = new Set(all.map(a => a.press).filter(Boolean));
  const hottest = all.slice().sort((a, b) => (b.coverage - a.coverage) || (b.score - a.score))[0];
  const byCov = perKw.slice().sort((a, b) => b.coverage - a.coverage);
  let narr = `${fmtDate(day.date)} 부동산 뉴스는 ${day.keywords.length}개 핵심 키워드(${day.keywords.map(k => k.keyword).join('·')})를 중심으로 `
    + `${all.length}건이 선별되었고, 언론사 ${press.size}곳의 보도가 포함되었습니다. `;
  if (hottest) narr += `가장 많이 보도된 이슈는 “${hottest.title}”로, 관련 보도가 약 ${hottest.coverage}건 확인됩니다. `;
  if (byCov.length) narr += `키워드별 보도량은 '${byCov[0].kw.keyword}'가 가장 많았고${byCov[1] ? `, '${byCov[1].kw.keyword}'가 뒤를 이었습니다` : ''}. `;
  const clear = sig.filter(shownSig);
  narr += clear.length
    ? `기사 표현으로 본 시장 흐름은 ${clear.map(r => `${r.id} ${aspectLabel(r)}`).join(', ')}입니다. `
    : '가격·물량·거래의 방향을 판단할 만한 근거(기사 3건 이상)가 부족했습니다. ';
  narr += `자주 언급된 표현은 ${terms.slice(0, 5).map(t => `'${t[0]}'`).join(', ')} 입니다.`;
  return { all, key, sig, terms, perKw, press, narr };
}

/* ================================================================ 유틸 */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
function fmtDate(d) { const [y, m, dd] = d.split('-'); const w = '일월화수목금토'[new Date(+y, m - 1, +dd).getDay()]; return `${+m}월 ${+dd}일(${w})`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1600); }
function sigBar(r) {
  const pct = ((r.v + 1) / 2 * 100).toFixed(1);
  const lab = aspectLabel(r), cls = r.v > 0.15 ? 'pos' : r.v < -0.15 ? 'neg' : '';
  return `<div class="sig"><b class="signame">${esc(r.id)}</b><span class="end neg">${r.neg}</span><div class="sigbar"><i style="left:${pct}%"></i></div><span class="end pos">${r.pos}</span>`
    + `<span class="siglab ${cls}">${lab} <small>${r.v >= 0 ? '+' : ''}${r.v.toFixed(2)} · 근거 ${r.n}건</small></span></div>`;
}
function sigBars(rows, max) {
  const shown = rows.filter(shownSig).sort((a, b) => max ? b.n - a.n : 0).slice(0, max || 6);
  if (!shown.length) return max ? '' : '<p class="note">근거 기사 3건 이상인 시장 지표가 없습니다.</p>';
  return `<div class="sigs">${shown.map(sigBar).join('')}</div>`;
}
function evidenceHtml(rows) {
  const shown = rows.filter(shownSig);
  if (!shown.length) return '';
  return `<details class="others"><summary>판단 근거 보기 (기사 ${shown.reduce((s, r) => s + r.n, 0)}건)</summary>${shown.map(r => `
    <p class="evh">${esc(r.id)} — ${aspectLabel(r)}</p><ul>${r.ev.slice(0, 8).map(e => `<li><span class="${e.vote > 0 ? 'pos' : 'neg'}">${e.vote > 0 ? '▲ ' + r.pos : '▼ ' + r.neg}</span> ${esc(e.clause)}
      ${e.opinion ? '<span class="badge">전망·의견</span>' : ''}${e.art.url ? `<a class="src" href="${safeUrl(e.art.url)}" target="_blank" rel="noopener">${esc(e.art.press)} ↗</a>` : `<span class="src">${esc(e.art.press)} (표본)</span>`}</li>`).join('')}</ul>`).join('')}</details>`;
}
function sourceName(s) { return s === 'both' ? 'Google+Naver' : s === 'naver' ? 'Naver' : 'Google'; }
function articleHtml(a, rankNo) {
  const others = (a.others || []).length ? `<details class="others"><summary>같은 이슈 다른 보도 ${a.others.length}건</summary><ul>${a.others.map(o =>
    `<li><a href="${safeUrl(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a> <span class="src">${esc(o.press)}</span></li>`).join('')}</ul></details>` : '';
  return `<div class="art"><div class="rk">${rankNo}</div><div class="body">
    <a class="t" href="${safeUrl(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    <div class="meta">${a.popular ? '<span class="badge hot">네이버 많이 본 뉴스</span>' : ''}<span class="badge cov">관련 보도 ${a.coverage}건</span>
      ${esc(a.press)} · ${sourceName(a.source)}${a.pubDate ? ' · ' + esc(a.pubDate) : ''}
      ${a.naverUrl ? ` · <a href="${safeUrl(a.naverUrl)}" target="_blank" rel="noopener">네이버뉴스</a>` : ''} · 화제도 ${a.score}</div>
    ${a.snippet ? `<p class="snip">${esc(a.snippet)}</p>` : ''}${others}</div></div>`;
}

/* ================================================================ 화면 */
/* ================================================================ 관련 기사 팝업
   단어에 data-tip 을 달아두면 마우스를 올렸을 때(휴대폰은 탭) 관련 기사 목록을 띄운다. */
const TIPS = new Map();
let tipSeq = 0, tipTimer = null, tipOwner = null;
function tipAttr(word, arts, total) { const id = 't' + (++tipSeq); TIPS.set(id, { word, arts: arts || [], total }); return `data-tip="${id}"`; }
function matchArts(arts, word) {
  const w = String(word).toUpperCase();
  return arts.filter(a => ((a.title || '') + ' ' + (a.snippet || '')).toUpperCase().includes(w));
}
// 표본 기사 번호 목록 -> 기사. 옛 기록처럼 번호가 없으면 fallback(선별 기사 검색) 사용
function sampleArts(day, docs, fallback) {
  const pool = day.analysis.sampleArts;
  if (pool && docs && docs.length) return docs.map(i => pool[i]).filter(Boolean).map(x => ({ title: x.t, url: x.u, press: x.p }));
  return fallback ? fallback() : [];
}
function showTip(el) {
  const info = TIPS.get(el.getAttribute('data-tip'));
  if (!info) return;
  const box = $('#tip');
  const shown = Math.min(8, info.arts.length), total = Math.max(info.total || 0, info.arts.length);
  box.innerHTML = `<div class="tip-h">‘${esc(info.word)}’ 관련 기사 ${total > shown ? `${total}건 중 ${shown}건` : `${total}건`}</div>` + (info.arts.length
    ? `<ul>${info.arts.slice(0, 8).map(a => `<li><a href="${safeUrl(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>${a.press ? ` <span class="src">${esc(a.press)}</span>` : ''}</li>`).join('')}</ul>`
    : '<p class="note" style="margin:6px 0 0">관련 기사가 없습니다.</p>');
  box.hidden = false;
  const r = el.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - bw - 8);
  let top = r.bottom + 6;
  if (top + bh > window.innerHeight - 8 && r.top - bh - 6 > 8) top = r.top - bh - 6;
  box.style.left = (left + window.scrollX) + 'px';
  box.style.top = (top + window.scrollY) + 'px';
  tipOwner = el;
}
function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { $('#tip').hidden = true; tipOwner = null; }, 250); }
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { clearTimeout(tipTimer); if (el !== tipOwner) tipTimer = setTimeout(() => showTip(el), 120); }
  else if (e.target.closest && e.target.closest('#tip')) clearTimeout(tipTimer);
  else if (tipOwner || !$('#tip').hidden) hideTipSoon();
});
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { e.preventDefault(); clearTimeout(tipTimer); if (el === tipOwner && !$('#tip').hidden) { $('#tip').hidden = true; tipOwner = null; } else showTip(el); }
  else if (!(e.target.closest && e.target.closest('#tip'))) { $('#tip').hidden = true; tipOwner = null; }
});
window.addEventListener('scroll', () => { if (!$('#tip').hidden && tipOwner) showTip(tipOwner); }, { passive: true });

const state = { date: INDEX[0] && INDEX[0].date, tab: 'brief', kw: 0 };
try { state.tab = localStorage.getItem('re.tab') || 'brief'; } catch (e) {}

async function render() {
  TIPS.clear(); const tipBox = $('#tip'); if (tipBox) tipBox.hidden = true; tipOwner = null;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const v = $('#view');
  if (!INDEX.length) {
    v.innerHTML = `<div class="card empty"><h2>아직 수집된 데이터가 없습니다</h2><p>${window.IS_WEB ? '첫 자동 수집이 끝나면 이곳에 뉴스가 표시됩니다. 잠시 후 새로고침해 주세요.' : '폴더의 <code>run_collect.bat</code> 를 더블클릭하면 오늘 뉴스를 수집합니다.<br>수집이 끝나면 이 페이지를 새로고침하세요.'}</p></div>`;
    return;
  }
  const i = INDEX.findIndex(x => x.date === state.date);
  $('#prev').disabled = i >= INDEX.length - 1; $('#next').disabled = i <= 0;
  $('#dateSel').value = state.date;
  const meta = INDEX[i];
  $('#collected').textContent = meta ? `${fmtDate(meta.date)} · 수집 ${meta.collectedAt.slice(11, 16)}${i === 0 ? ' · 최신' : ' · 과거 기록'}` : '';
  if (state.tab === 'trend') return renderTrend(v);
  if (state.tab === 'search') return renderSearch(v);
  if (state.tab === 'policy') return renderPolicy(v);
  v.innerHTML = '<div class="empty">불러오는 중…</div>';
  let day;
  try { day = await loadDay(state.date); } catch (e) { v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  if (state.tab === 'brief') renderBrief(v, day);
  else if (state.tab === 'news') renderNews(v, day);
  else renderAnalysis(v, day);
}

    <div class="kwgrid">

      <div class="card"><h3>표본 전체(${day.analysis.corpusSize}건) 이슈어 <span class="src">상자 면적 = 등장 기사 수</span></h3>

function methodHtml(day) {
  const n = day.keywords.length;
  // 접이식(아코디언): 평소엔 제목만 보이고 "자세히 보기"를 누르면 펼쳐짐
  return `<details class="card method"><summary><b>용어 및 산출 근거</b> <span class="more">자세히 보기</span></summary>

      <b>점수 = 0.45 × 출현 + 0.35 × 연관 중심성 + 0.20 × 모멘텀</b> (각 항목은 최댓값 기준으로 0~1 환산)

      <li><b>연관 중심성</b>: 키워드끼리 같은 기사에 함께 등장한 횟수로 연결망을 만들고 PageRank로 계산한, 다른 이슈와 얼마나 중심적으로 엮여 있는지의 값</li>
      <li><b>모멘텀</b>: 오늘 출현율 ÷ 최근 7일 평균 출현율 (최대 3배)</li></ul>
      점수 순으로 고르되 이미 고른 키워드와 기사가 50% 넘게 겹치면 건너뛰어 서로 다른 주제 ${n}개를 고릅니다. 세부 점수는 ‘키워드 연관도 분석’ 탭에 있습니다.</dd>

    <dt>화제도</dt>
    <dd>포털이 기사별 조회수를 공개하지 않아 대신 쓰는 인기 점수입니다. 같은 이슈를 다룬 기사를 제목 유사도로 하나로 묶은 뒤 계산합니다.<br>
      <b>화제도 = 2 × 보도 언론사 수 + 0.4 × 네이버 관련뉴스 수(최대 30) + 0.3 × 구글 관련기사 수(최대 10)
      + 2(구글·네이버 동시 노출) + 8(네이버 ‘많이 본 뉴스’ 포함) + 검색 순위 가점(최대 3)</b><br>
      키워드마다 화제도 상위 10개 이슈를 보여줍니다.</dd>

    <dt>관련 보도 N건</dt>
    <dd>같은 이슈를 보도한 기사 수의 추정치입니다. 직접 확인한 언론사 수와 네이버 ‘관련뉴스 N건’ 표시 중 큰 값을 씁니다.</dd>

    <dt>네이버 많이 본 뉴스</dt>

    <dt>시장 지표</dt>
    <dd>그날의 선별 기사와 키워드 분석 표본 기사(약 350건)의 제목(PC 버전은 요약문 포함)을 구절 단위로 나눈 뒤, 한 구절 안에서 <b>대상</b>과 <b>방향</b> 표현을 짝지어 판정합니다.
      <table class="mt"><tr><th>지표</th><th>대상 표현 (예)</th><th>판정</th></tr>
        <tr><td>매매 가격</td><td>집값, 아파트값, 매매가, 호가, 분양가, 신고가</td><td>높아지면 <span class="pos">상승</span> · 낮아지면 <span class="neg">하락</span></td></tr>
        <tr><td>전월세 가격</td><td>전셋값, 전세가, 월세, 임대료, 역전세</td><td>높아지면 <span class="pos">상승</span> · 낮아지면 <span class="neg">하락</span></td></tr>
        <tr><td>매매 물량</td><td>미분양, 입주물량, 매물, 공급, 인허가, 착공</td><td>많아지면 <span class="pos">증가</span> · 적어지면 <span class="neg">감소</span></td></tr>
        <tr><td>전월세 물량</td><td>전세 매물, 월세 매물, 전세난</td><td>많아지면 <span class="pos">증가</span> · 적어지면 <span class="neg">감소</span></td></tr>
        <tr><td>매매 거래</td><td>거래량, 매매 거래, 거래 건수, 청약 경쟁률</td><td>많아지면 <span class="pos">증가</span> · 적어지면 <span class="neg">감소</span></td></tr>
        <tr><td>전월세 거래</td><td>전세·월세 문맥의 거래량, 거래 건수</td><td>많아지면 <span class="pos">증가</span> · 적어지면 <span class="neg">감소</span></td></tr>
      </table>
      <ul><li><b>방향 표현</b>: 오름 쪽(상승, 올라, 급등, 증가, 늘어, 확대, 쌓여, 적체 등)과 내림 쪽(하락, 떨어져, 급락, 감소, 줄어, 급감, 품귀, 최저 등)</li>
      <li><b>짝짓기</b>: 방향 표현마다 같은 구절 안에서 가장 가까운(20자 이내) 대상과 짝짓습니다. 대상 단어만으로 매매·전월세가 정해지지 않으면 구절에 전세·월세·임대차가 있을 때 전월세로 봅니다.</li>
      <li><b>보정</b>: “않·없” 같은 부정 표현이 뒤따르면 방향을 뒤집고, “멈춰·그쳐”는 반대 방향 절반으로 셉니다. “가능성·우려·전망·예상·?” 등이 들어간 의견·전망 구절은 가중치 0.4로 낮춥니다.</li>

      <li><b>판정</b>: 지수 +0.15 초과면 상승(증가) 우세, −0.15 미만이면 하락(감소) 우세, 그 사이는 혼조입니다. ‘근거 N건’은 판정에 쓰인 기사 수이며, ‘판단 근거 보기’에서 실제 구절을 확인할 수 있습니다.</li>
      <li><b>표시 기준</b>: 근거 기사가 <b>3건 미만인 지표는 신뢰도가 낮아 표시하지 않습니다</b>(요약문, 추이 그래프 포함).</li></ul>

      ${window.IS_WEB ? '웹 공개판은 저작권 보호를 위해 기사 요약문 없이 제목만으로 판정합니다.' : ''}</p></dd>

    <dt>핵심 문장 · 키워드별 요약</dt>
    <dd>TextRank 방식의 추출 요약입니다. 문장끼리 겹치는 단어로 연결망을 만들어 PageRank로 중심 문장을 고릅니다. 이때 화제도가 높은 기사의 문장에 가중치를 주고, 비슷한 문장은 하나만 남기며, 키워드마다 최대 1문장씩 뽑습니다. 문장을 새로 만들지 않고 기사 속 문장을 그대로 가져옵니다.</dd>

    <dt>오늘의 이슈어 · 표본 전체 이슈어</dt>
    <dd>기사에서 조사를 떼어낸 단어 가운데 일반 단어(기자, 오늘, 부동산 등)를 빼고, 그 단어가 등장한 기사 수가 많은 순으로 보여줍니다. ‘오늘의 이슈어’는 선별 기사 기준, ‘표본 전체 이슈어’는 키워드 분석 표본 전체 기준입니다.</dd>
  </dl></details>`;
}

function renderAnalysis(v, day) {
  const C = day.analysis.candidates || [];
  const maxS = Math.max(...C.map(c => c.score), 0.001);
  // 키워드에 마우스를 올리면 표본 기사 중 그 키워드가 나온 기사 목록 (옛 기록은 선별 기사에서 찾음)
  const dayArts = day.keywords.flatMap(k => k.articles.map(a => ({ ...a, keyword: k.keyword })));
  const candTip = c => tipAttr(c.kw, sampleArts(day, c.docs, () => dayArts.filter(a => a.keyword === c.kw).concat(matchArts(dayArts.filter(a => a.keyword !== c.kw), c.kw))), c.docs && c.docs.length ? c.df : 0);
  v.innerHTML = `<div class="card"><h2>키워드 선정 방식</h2><p class="note">
    ① “부동산·아파트·주택 시장·부동산 정책” 기사 ${day.analysis.corpusSize}건(구글+네이버, 최근 24시간)과 네이버 많이 본 뉴스 중 부동산 기사를 표본으로 수집합니다.<br>
    ② 후보 키워드 ${C.length}개(설정 파일에서 편집 가능)가 각 기사에 등장하는지 확인해 <b>출현 기사 수</b>를 셉니다.<br>
    ③ 같은 기사에 함께 등장한 횟수로 <b>공출현 네트워크</b>를 만들고 가중 PageRank로 <b>연관 중심성</b>을 계산합니다.<br>
    ④ 최근 7일 평균 대비 오늘 출현 비율로 <b>모멘텀</b>을 구합니다. 점수 = 0.45×출현 + 0.35×중심성 + 0.20×모멘텀.<br>
    ⑤ 점수 순으로 고르되, 이미 고른 키워드와 기사 집합이 50% 넘게 겹치면 제외해 <b>서로 다른 주제 ${day.keywords.length}개</b>를 확보합니다.</p></div>
  <div class="card"><h2>공출현 네트워크 <span class="sub">상위 14개 후보 · 선 굵기 = 함께 등장한 기사 수</span></h2>${networkSvg(C.slice(0, 14), day.analysis.edges || [], candTip)}</div>
  <p class="note" style="margin:-8px 0 14px">키워드(원·이름)에 마우스를 올리면(휴대폰은 탭) 관련 기사 목록이 나타납니다.</p>
  <div class="card scroll"><h2>후보 키워드 점수표</h2><table>
    <tr><th>키워드</th><th></th><th>점수</th><th class="num">출현 기사</th><th class="num">출현율</th><th class="num">중심성</th><th class="num">모멘텀</th></tr>
    ${C.map(c => `<tr><td class="${c.selected ? 'sel' : ''}"><span class="tipword" ${candTip(c)}>${c.selected ? '✔ ' : ''}${esc(c.kw)}</span></td>
      <td style="width:35%"><div class="hbar" style="width:${(c.score / maxS * 100).toFixed(1)}%;${c.selected ? '' : 'opacity:.3'}"></div></td>
      <td class="num">${c.score.toFixed(3)}</td><td class="num">${c.df}</td><td class="num">${(c.freq * 100).toFixed(1)}%</td>
      <td class="num">${c.centrality.toFixed(3)}</td><td class="num">${c.momentum.toFixed(2)}×</td></tr>`).join('')}
  </table></div>`;
}

function networkSvg(nodes, edges, tipOf) {
  const W = 720, H = 440, cx = W / 2, cy = H / 2, R = 165;
  const pos = {};
  nodes.forEach((n, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / nodes.length; pos[n.kw] = [cx + R * Math.cos(a) * 1.25, cy + R * Math.sin(a)]; });
  const es = edges.filter(e => pos[e.a] && pos[e.b]);
  const maxW = Math.max(1, ...es.map(e => e.w)), maxDf = Math.max(1, ...nodes.map(n => n.df));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="키워드 공출현 네트워크">
    ${es.map(e => `<line x1="${pos[e.a][0]}" y1="${pos[e.a][1]}" x2="${pos[e.b][0]}" y2="${pos[e.b][1]}" stroke="var(--accent)" stroke-opacity="${0.15 + 0.6 * e.w / maxW}" stroke-width="${0.5 + 6 * e.w / maxW}"><title>${esc(e.a)} – ${esc(e.b)}: ${e.w}건</title></line>`).join('')}
    ${nodes.map(n => { const [x, y] = pos[n.kw]; const r = 6 + 16 * Math.sqrt(n.df / maxDf);
      const tip = tipOf ? tipOf(n) : '';
      return `<circle ${tip} style="cursor:pointer" cx="${x}" cy="${y}" r="${r}" fill="${n.selected ? 'var(--accent)' : 'var(--panel)'}" stroke="var(--accent)" stroke-width="1.5"></circle>
      <text ${tip} x="${x}" y="${y + r + 13}" text-anchor="middle" style="cursor:pointer;font-weight:${n.selected ? 700 : 400}">${esc(n.kw)}</text>`; }).join('')}
  </svg>`;
}

async function renderTrend(v) {
  v.innerHTML = '<div class="empty" id="prog">전체 기록 불러오는 중…</div>';
  const days = await loadAll((a, b) => { const p = $('#prog'); if (p) p.textContent = `최근 기록 불러오는 중… ${a}/${b}`; }, 30);  // 추이는 최근 30일만 표시
  if (days.length < 2) {
    v.innerHTML = `<div class="card empty">추이 분석은 2일 이상 데이터가 쌓이면 표시됩니다. (현재 ${days.length}일)</div>`;
    return;
  }
  const recent = days.slice(-30);
  // 지표별 일자 시계열 (근거가 있는 날만 점으로 표시)
  const perDay = recent.map(d => ({ date: d.date, rows: marketSignals(signalPool([d])) }));
  const series = ASPECTS.map((a, ai) => ({ a, points: perDay.map(d => ({ date: d.date, v: d.rows[ai].v, n: d.rows[ai].n })) }))
    .filter(s => s.points.some(shownSig));
  // 키워드별 출현율 히트맵: 기간 내 선정된 적 있는 키워드
  const kwSet = new Map();
  recent.forEach(d => d.analysis.candidates.forEach(c => { if (c.selected) kwSet.set(c.kw, (kwSet.get(c.kw) || 0) + 1); }));
  const kws = [...kwSet.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const maxF = Math.max(0.001, ...recent.flatMap(d => d.analysis.candidates.filter(c => kwSet.has(c.kw)).map(c => c.freq)));
  // 급상승 이슈어: 최근 3일 vs 이전 기간
  const termFreq = ds => { const m = new Map(); let n = 0; signalPool(ds).forEach(a => { n++; new Set(tokens(a.title + ' ' + (a.snippet || ''))).forEach(t => m.set(t, (m.get(t) || 0) + 1)); });  /* 선별 + 표본 전체 */ return { m, n: Math.max(1, n) }; };
  const nowF = termFreq(recent.slice(-3)), prevF = termFreq(recent.slice(0, -3));
  const rising = [...nowF.m.entries()].filter(([t, c]) => c >= 3 && !isPredicate(t)).map(([t, c]) => {
    const now = c / nowF.n, prev = (prevF.m.get(t) || 0) / prevF.n; return [t, now, prev, (now + 0.005) / (prev + 0.005)];
  }).sort((a, b) => b[3] - a[3]).slice(0, 15);

  v.innerHTML = `
  <div class="card"><h2>시장 지표 추이 <span class="sub">최근 ${recent.length}일 · 선별 + 표본 기사 전체의 표현 기준 · 근거 3건 미만인 날은 빈칸</span></h2>
    <div class="grid2">${series.map(s => `<div><p class="evh">${esc(s.a.id)} <span class="src">위 ${s.a.pos} · 아래 ${s.a.neg}</span></p>${lineSvg(s.points, s.a.pos, s.a.neg)}</div>`).join('') || '<p class="note">판단 근거가 있는 날이 없습니다.</p>'}</div></div>
  <div class="card scroll"><h2>선정 키워드 출현율 추이 <span class="sub">진할수록 많이 보도 · ● = 그날 선정</span></h2>
    <table class="hm"><tr><th></th>${recent.map(d => `<th style="text-align:center">${+d.date.slice(5, 7)}/${+d.date.slice(8)}</th>`).join('')}</tr>
    ${kws.map(k => `<tr><th>${esc(k)}</th>${recent.map(d => { const c = d.analysis.candidates.find(x => x.kw === k); const f = c ? c.freq : 0;
      return `<td title="${esc(k)} ${d.date}: ${(f * 100).toFixed(1)}%" style="background:rgba(36,87,214,${(0.08 + 0.8 * f / maxF).toFixed(2)})">${c && c.selected ? '●' : ''}</td>`; }).join('')}</tr>`).join('')}
    </table></div>
  <div class="card"><h2>급상승 이슈어 <span class="sub">최근 3일 vs 그 이전 출현율 · 선별 + 표본 기사 전체 기준</span></h2>
    <table><tr><th>단어</th><th class="num">최근 3일</th><th class="num">이전</th><th class="num">배율</th></tr>
    ${rising.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${(r[1] * 100).toFixed(1)}%</td><td class="num">${(r[2] * 100).toFixed(1)}%</td><td class="num">${r[3].toFixed(1)}×</td></tr>`).join('')}</table></div>`;
}

function lineSvg(points, posLabel, negLabel) {
  const W = 480, H = 200, L = 40, R = 22, T = 12, B = 28;
  const x = i => L + (W - L - R) * (points.length === 1 ? 0.5 : i / (points.length - 1));
  const y = v => T + (H - T - B) * (1 - (v + 1) / 2);
  const has = p => p.n == null || shownSig(p);
  let path = '', pen = false;
  points.forEach((p, i) => { if (!has(p)) { pen = false; return; } path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`; pen = true; });
  const step = Math.ceil(points.length / 6);
  const gl = { 1: posLabel || '+1', 0: '0', [-1]: negLabel || '-1' };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[-1, 0, 1].map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${gl[g]}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${points.map((p, i) => has(p) ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="${p.v >= 0 ? 'var(--up)' : 'var(--down)'}"><title>${p.date}: ${p.v.toFixed(2)}${p.n != null ? ' · 근거 ' + p.n + '건' : ''}</title></circle>` : '').join('')}
    ${points.map((p, i) => i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${+p.date.slice(5, 7)}/${+p.date.slice(8)}</text>` : '').join('')}
  </svg>`;
}

/* 별도 데이터 파일(policies.js, periods.js)을 필요할 때 한 번만 불러옴 */
function loadGlobal(name, src) {
  if (window[name]) return Promise.resolve(window[name]);
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = src + (window.IS_WEB ? '?v=' + Date.now() : '');
    s.onload = () => res(window[name] || null);
    s.onerror = () => res(null);
    document.head.appendChild(s);
  });
}

/* ================================================================ 과거 기사 검색 + 시기별 비교 */
/* 시기 정의: 기준일(가장 최근 수집일)에서 거슬러 올라간 시점 ± 허용 범위(일).
   매일 쌓인 수집 기록 중 그 범위에 있는 날들의 기사를 모아 비교한다. 기록이 없으면 '기록 없음'. */
const PERIOD_DEFS = [
  { label: '1일 전', d: 1, win: 0 }, { label: '1주 전', d: 7, win: 1 }, { label: '1개월 전', m: 1, win: 3 }, { label: '3개월 전', m: 3, win: 7 },
  { label: '6개월 전', m: 6, win: 10 }, { label: '1년 전', y: 1, win: 15 }, { label: '3년 전', y: 3, win: 30 }, { label: '6년 전', y: 6, win: 30 }
];
const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
function periodRows(q, days) {
  const terms = q ? q.toLowerCase().split(/\s+/).filter(Boolean) : [];
  const match = a => !terms.length || terms.every(w => ((a.title || '') + ' ' + (a.snippet || '')).toLowerCase().includes(w));
  const dayArts = d => d.keywords.flatMap(k => k.articles.map(a => ({ ...a, date: d.date })));
  const today = days[days.length - 1];
  const base = new Date(today.date + 'T00:00:00');
  const rows = [{ label: '오늘', target: today.date, from: today.date, to: today.date, nDays: 1, arts: dayArts(today).filter(match), pool: signalPool([today]).filter(match) }];
  for (const def of PERIOD_DEFS) {
    const t = new Date(base);
    if (def.d) t.setDate(t.getDate() - def.d);
    if (def.m) t.setMonth(t.getMonth() - def.m);
    if (def.y) t.setFullYear(t.getFullYear() - def.y);
    const lo = new Date(t), hi = new Date(t); lo.setDate(lo.getDate() - def.win); hi.setDate(hi.getDate() + def.win);
    const used = days.filter(d => d.date >= ymd(lo) && d.date <= ymd(hi) && d.date < today.date);
    const seen = new Set(), arts = [];
    for (const d of used) for (const a of dayArts(d)) if (match(a) && !seen.has(a.url)) { seen.add(a.url); arts.push(a); }
    rows.push({ label: def.label, target: ymd(t), from: used.length ? used[0].date : '', to: used.length ? used[used.length - 1].date : '', nDays: used.length, arts, pool: signalPool(used).filter(match) });
  }
  const qTok = new Set(tokens(q || ''));
  const generic = new Set(['부동산', '아파트', '주택', '시장', '서울', '정부', '전국']);
  for (const r of rows) {
    r.terms = topTerms(r.arts, 8, new Set([...qTok, ...generic]));
    r.sig = marketSignals(r.pool || r.arts).filter(shownSig);
    r.key = textRank(r.arts.filter(a => !/(\.\.\.|…)\s*$/.test(a.title || '')).map(a => ({ text: a.title, art: a, weight: Math.log(2 + (a.coverage || 1)) })), 3);
  }
  // 시기별로 두드러진 단어 표시: 과거 시기는 '오늘 핵심어에 없는 단어', 오늘은 '과거 어느 시기에도 없던 단어'
  const set = r => new Set(r.terms.map(t => t[0]));
  const todaySet = new Set(topTerms(rows[0].arts, 20, qTok).map(t => t[0]));
  const pastSet = new Set(rows.slice(1).flatMap(r => topTerms(r.arts, 20, qTok).map(t => t[0])));
  for (const r of rows) r.uniq = new Set([...set(r)].filter(t => r.label === '오늘' ? !pastSet.has(t) : !todaySet.has(t)));
  return rows;
}function periodNarrative(q, rows) {
  const pick = ['6년 전', '3년 전', '1년 전', '6개월 전', '3개월 전', '1개월 전', '1주 전', '1일 전', '오늘'].map(l => rows.find(r => r.label === l)).filter(r => r && r.terms.length);
  if (pick.length < 2) return '';
  const subj = q ? `‘${q}’ 관련 보도의` : '부동산 보도의';
  return `${subj} 핵심어는 ` + pick.map(r => `${r.label} ‘${r.terms.slice(0, 2).map(t => t[0]).join('·')}’`).join(' → ') + ' 순으로 바뀌었습니다.';
}
function periodHtml(q, rows, days) {
  const chip = (t, r) => `<span class="chip static${r.uniq.has(t[0]) ? ' uniq' : ''}">${esc(t[0])}</span>`;
  const sigTxt = r => r.sig.length ? r.sig.map(s => `<span class="${s.v > 0.15 ? 'pos' : s.v < -0.15 ? 'neg' : ''}">${esc(s.id)} ${aspectLabel(s)}</span>`).join('<br>') : '<span class="note">근거 부족</span>';
  return `<div class="card"><h2>시기별 비교 <span class="sub">${q ? `“${esc(q)}”` : '부동산 전반'} · 기준일 ${esc(rows[0].target)}</span></h2>
    ${periodNarrative(q, rows) ? `<p class="narr">${esc(periodNarrative(q, rows))}</p>` : ''}
    <div class="scroll"><table class="ptable"><tr><th>시기</th><th>기간</th><th class="num">관련 기사</th><th>핵심어 <span class="note">(굵게 = 그 시기에 두드러진 단어)</span></th><th>시장 지표</th></tr>
    ${rows.map(r => !r.nDays
      ? `<tr><td><b>${esc(r.label)}</b></td><td class="note">${esc(r.target)} 전후</td><td colspan="3" class="note">아직 기록 없음 — 수집 기록이 쌓이면 자동으로 채워집니다</td></tr>`
      : `<tr><td><b>${esc(r.label)}</b></td><td class="note">${r.from === r.to ? esc(r.from) : `${esc(r.from)}<br>~${esc(r.to)} (${r.nDays}일)`}</td>
      <td class="num">${r.arts.length}</td><td style="white-space:normal"><div class="chips">${r.terms.map(t => chip(t, r)).join('') || '<span class="note">-</span>'}</div></td>
      <td style="white-space:normal;font-size:12.5px">${sigTxt(r)}</td></tr>`).join('')}
    </table></div>
    <h2 style="margin-top:18px">시기별 대표 기사</h2>
    ${rows.filter(r => r.nDays).map(r => `<details class="others pd"><summary><b>${esc(r.label)}</b> · ${r.arts.length}건${r.key[0] ? ` — ${esc(r.key[0].text)}` : ''}</summary>
      ${r.key.length ? `<ol class="keysent">${r.key.map(s => `<li><a href="${safeUrl(s.art.url)}" target="_blank" rel="noopener">${esc(s.text)}</a> <span class="src">${esc(s.art.press || '')} ${esc(s.art.date || '')}</span></li>`).join('')}</ol>` : '<p class="note">관련 기사가 없습니다.</p>'}
      ${r.arts.length > 3 ? `<ul>${r.arts.filter(a => !r.key.some(k => k.art === a)).slice(0, 7).map(a => `<li><a href="${safeUrl(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span class="src">${esc(a.press || '')}</span></li>`).join('')}</ul>` : ''}
    </details>`).join('')}
    <p class="note">※ 매일 쌓인 수집 기록(하루 약 60건)으로 비교합니다. 현재 기록은 ${days.length}일치(${esc(days[0].date)} ~ ${esc(days[days.length - 1].date)})이며,
      각 시기는 기준일에서 거슬러 올라간 날짜 전후(1주 전 ±1일, 1개월 전 ±3일, 3개월 전 ±7일, 6개월 전 ±10일, 1년 전 ±15일, 3·6년 전 ±30일)의 기록을 모아 씁니다.
      시장 지표는 근거 기사 3건 이상일 때만 표시합니다.</p></div>`;
}

async function renderSearch(v) {
  v.innerHTML = `<div class="searchbox"><input id="q" placeholder="검색어 (예: 재건축, 전세사기, 금리) · 비우면 부동산 전반 비교" value="${esc(state.q || '')}"><button class="btn" id="go">검색</button></div>
    <div id="cmp"><div class="card"><p class="note">시기별 자료 불러오는 중…</p></div></div><div id="res"></div>`;
  const run = async () => {
    const q = $('#q').value.trim(); state.q = q;
    $('#cmp').innerHTML = '<div class="card"><p class="note">분석 중…</p></div>';
    const days = await loadAll();
    if (!days.length) { $('#cmp').innerHTML = '<div class="card"><p class="note">수집 기록이 없습니다.</p></div>'; return; }
    $('#cmp').innerHTML = periodHtml(q, periodRows(q, days), days);
    if (!q) { $('#res').innerHTML = ''; return; }
    const terms = q.toLowerCase().split(/\s+/);
    const hits = [];
    for (const d of days.slice().reverse()) for (const k of d.keywords) for (const a of k.articles) {
      const t = (a.title + ' ' + (a.snippet || '') + ' ' + k.keyword).toLowerCase();
      if (terms.every(w => t.includes(w))) hits.push({ a, d: d.date, k: k.keyword });
    }
    $('#res').innerHTML = `<div class="card"><h2>수집 기록 검색 결과 <span class="sub">“${esc(q)}” · ${INDEX.length}일치 기록 중 ${hits.length}건</span></h2>` + (hits.slice(0, 200).map(h =>
      `<div class="art"><div class="body"><div class="meta">${esc(h.d)} · #${esc(h.k)}</div>${articleHtml(h.a, '').replace('<div class="art"><div class="rk"></div>', '<div>')}</div></div>`).join('') || '<p class="note">결과가 없습니다.</p>') + '</div>';
  };
  $('#go').onclick = run;
  $('#q').onkeydown = e => { if (e.key === 'Enter') run(); };
  run();
}

/* ================================================================ 부동산 정책 (정부 보도자료) */
const POLICY_CATS = [
  ['공급', /공급|착공|인허가|신도시|택지|공공주택|매입임대|주택건설|입주|복합사업/],
  ['대출·금융', /대출|DSR|LTV|PF|가계부채|금융|보증(?!금)|주담대|이차보전|자금/],
  ['세제', /과세|세제|공시가격|보유세|종부세|양도세|취득세|재산세/],
  ['임대차·전세', /전세|월세|임대차|임차|세입자|보증금/],
  ['청약·분양', /청약|분양/],
  ['정비사업', /재건축|재개발|정비사업|노후계획도시|리모델링|이주비/],
  ['시장·통계', /거래|실거래|동향|통계|점검회의|이상거래|토지거래허가|주택가격/],
  ['건설', /건설|하도급|시공|공사비|건설사|건설현장|안전점검|부실시공|건설업/]
];
function policyCats(p) {
  const t = p.title + ' ' + (p.points || []).join(' ');
  const c = POLICY_CATS.filter(([, re]) => re.test(t)).map(([n]) => n).slice(0, 2);
  return c.length ? c : ['기타'];
}
async function renderPolicy(v) {
  v.innerHTML = '<div class="empty">정책 자료 불러오는 중…</div>';
  const all = await loadGlobal('POLICIES', 'data/policies.js');
  if (!all || !all.length) { v.innerHTML = '<div class="card empty">정책 자료가 아직 없습니다. 다음 수집부터 표시됩니다.</div>'; return; }
  const base = new Date((INDEX[0] ? INDEX[0].date : all[0].date) + 'T00:00:00');
  const daysAgo = p => (base - new Date(p.date + 'T00:00:00')) / 864e5;
  all.forEach(p => p.cats = p.cats || policyCats(p));
  const week = all.filter(p => daysAgo(p) <= 7), month = all.filter(p => daysAgo(p) <= 30);
  const bySrc = s => month.filter(p => p.source === s).length;
  const catCount = n => month.filter(p => p.cats.includes(n)).length;
  const keyItems = [];
  for (const p of week) [p.title, ...(p.points || [])].forEach((t, i) => keyItems.push({ text: t, art: p, isTitle: !i, weight: Math.log(10 + (p.views || 0)) * (i ? 1 : 1.2) }));
  const key = textRank(keyItems, 4, it => it.art.id);  // 보도자료당 1문장
  const cats = ['전체', ...POLICY_CATS.map(c => c[0]), '기타'];
  state.pcat = state.pcat || '전체'; state.psrc = state.psrc || '전체';

  const draw = () => {
    const pq = (state.pq || '').toLowerCase();
    const list = all.filter(p => (state.pcat === '전체' || p.cats.includes(state.pcat)) && (state.psrc === '전체' || p.source === state.psrc)
      && (!pq || (p.title + ' ' + (p.points || []).join(' ') + ' ' + (p.dept || '')).toLowerCase().includes(pq)));
    const groups = [];
    for (const p of list.slice(0, 150)) { const g = groups[groups.length - 1]; if (g && g.date === p.date) g.items.push(p); else groups.push({ date: p.date, items: [p] }); }
    $('#plist').innerHTML = `<p class="note" style="margin:0 0 8px">${list.length}건${list.length > 150 ? ' (최근 150건 표시)' : ''}</p>` + (groups.map(g => `
      <div class="pday">${esc(g.date)} <span class="note">${fmtDate(g.date)}</span></div>
      ${g.items.map(p => `<div class="pol"><div class="meta"><span class="badge src-${p.source === '국토교통부' ? 'molit' : 'fsc'}">${esc(p.source)}</span>${p.cats.map(c => `<span class="badge cov">${esc(c)}</span>`).join('')}
          ${esc(p.dept || '')}${p.views ? ` · 조회 ${Number(p.views).toLocaleString()}` : ''}</div>
        <a class="t" href="${safeUrl(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        ${(p.points || []).length ? `<ul class="pts">${p.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="meta">${(p.files || []).map(f => `<a href="${safeUrl(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)} 원문</a> · `).join('')}<a href="${safeUrl(p.url)}" target="_blank" rel="noopener">보도자료 페이지 ↗</a></div>
        ${p.body ? `<details class="others"><summary>본문 일부 보기</summary><p class="note">${esc(p.body)}</p></details>` : ''}
      </div>`).join('')}`).join('') || '<p class="note">조건에 맞는 자료가 없습니다.</p>');
  };

  v.innerHTML = `
  <div class="kpis">
    <div class="kpi"><b>${week.length}</b><span>최근 7일 발표</span></div>
    <div class="kpi"><b>${month.length}</b><span>최근 30일 발표</span></div>
    <div class="kpi"><b>${bySrc('국토교통부')}</b><span>국토교통부 (30일)</span></div>
    <div class="kpi"><b>${bySrc('금융위원회')}</b><span>금융위원회 (30일)</span></div>
  </div>
  <div class="card"><h2>최근 7일 정책 요약 <span class="sub">정부 보도자료 요점 기준 · TextRank</span></h2>
    ${key.length ? `<ol class="keysent">${key.map(s => `<li>${esc(s.text)} <a class="src" href="${safeUrl(s.art.url)}" target="_blank" rel="noopener">${esc(s.art.source)} ${esc(s.art.date.slice(5))} ↗</a></li>`).join('')}</ol>` : '<p class="note">최근 7일간 부동산 관련 발표가 없습니다.</p>'}
    <div class="chips" style="margin-top:12px">${POLICY_CATS.map(c => `<span class="chip static">${c[0]} ${catCount(c[0])}</span>`).join('')}<span class="note" style="align-self:center">← 최근 30일 분야별 건수</span></div>
  </div>
  <div class="card">
    <h2>발표 자료 목록</h2>
    <div class="searchbox"><input id="pq" placeholder="정책 자료 검색 (예: 전세사기, PF, 공공재개발)" value="${esc(state.pq || '')}">
      <select id="psrc">${['전체', '국토교통부', '금융위원회'].map(s => `<option ${s === state.psrc ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    <div class="chips" id="pcats" style="margin-bottom:12px">${cats.map(c => `<span class="chip ${c === state.pcat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</div>
    <div id="plist"></div>
  </div>
  <p class="note">출처: 국토교통부 보도자료(www.molit.go.kr), 금융위원회 보도자료(www.fsc.go.kr). 정부 보도자료는 공공누리에 따라 출처를 밝히고 이용할 수 있습니다.
    국토교통부는 ‘주택토지’·‘건설’ 분야 전체와 그 밖의 분야 중 부동산 관련 제목, 금융위원회는 부동산·주택·대출 관련 제목만 모읍니다. 분야 분류는 제목·요점 단어 기준 자동 분류입니다.</p>`;
  draw();
  $('#pq').oninput = e => { state.pq = e.target.value; draw(); };
  $('#psrc').onchange = e => { state.psrc = e.target.value; draw(); };
  v.querySelectorAll('#pcats [data-c]').forEach(c => c.onclick = () => {
    state.pcat = c.dataset.c; v.querySelectorAll('#pcats .chip').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
}

/* ================================================================ 이벤트 */
function setTab(t) { state.tab = t; try { localStorage.setItem('re.tab', t); } catch (e) {} render(); }
function setDate(d) { state.date = d; state.kw = 0; render(); window.scrollTo(0, 0); }
$('#dateSel').innerHTML = INDEX.map(x => `<option value="${x.date}">${x.date} (${x.keywords.join(', ')})</option>`).join('');
$('#dateSel').onchange = e => setDate(e.target.value);
$('#prev').onclick = () => { const i = INDEX.findIndex(x => x.date === state.date); if (i < INDEX.length - 1) setDate(INDEX[i + 1].date); };
$('#next').onclick = () => { const i = INDEX.findIndex(x => x.date === state.date); if (i > 0) setDate(INDEX[i - 1].date); };
$('#latest').onclick = () => INDEX.length && setDate(INDEX[0].date);

/* ================================================================ 지금 수집 (웹 전용, 관리자)
   비밀번호는 어디에도 저장하지 않는다. trigger-key.js 에는 비밀번호로 암호화(PBKDF2 + AES-GCM)된
   GitHub 토큰만 있고, 올바른 비밀번호를 넣어야 복호화되어 수집 워크플로를 실행할 수 있다. */
const REPO = (() => {
  if (!window.IS_WEB || !location.hostname.endsWith('.github.io')) return null;
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return repo ? { owner: location.hostname.split('.')[0], repo } : null;
})();
const WORKFLOW = 'daily.yml';
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptToken(pw) {
  const k = window.TRIGGER_KEY;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(k.salt), iterations: k.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(k.iv) }, key, b64d(k.ct)));
}
function gh(token, path, opts) {
  return fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}${path}`, {
    ...opts, headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' } });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
let collecting = false;
function setStatus(msg) { const s = $('#trigStatus'); if (s) s.textContent = msg; }
function setBtn(label, busy) { const b = $('#collectNow'); b.textContent = label; b.disabled = !!busy; }

async function runCollect(pw) {
  const actionsUrl = `https://github.com/${REPO.owner}/${REPO.repo}/actions/workflows/${WORKFLOW}`;
  if (!window.TRIGGER_KEY) {
    setStatus('버튼 설정 파일(trigger-key.js)이 아직 업로드되지 않았습니다.\nGitHub Actions 페이지에서 직접 실행해 주세요.');
    window.open(actionsUrl, '_blank', 'noopener');
    return;
  }
  setStatus('비밀번호 확인 중…');
  let token;
  try { token = await decryptToken(pw); }
  catch (e) { await sleep(1200); setStatus('비밀번호가 올바르지 않습니다.'); return; }

  const started = Date.now();
  const res = await gh(token, `/actions/workflows/${WORKFLOW}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: 'main' }) });
  if (res.status !== 204) {
    setStatus(res.status === 401 ? 'GitHub 토큰이 만료되었거나 잘못되었습니다.\n토큰을 다시 발급해 설정 파일을 새로 만들어 주세요.'
      : `수집을 시작하지 못했습니다 (오류 ${res.status}).\n토큰에 Actions 읽기·쓰기 권한이 있는지 확인해 주세요.`);
    return;
  }
  collecting = true; setBtn('수집 중…', true);
  setStatus('수집을 시작했습니다. 보통 1~2분 걸립니다.\n이 창을 닫아도 계속 진행됩니다.');
  const prevStamp = INDEX[0] ? INDEX[0].collectedAt : '';
  try {
    // 1) 수집 워크플로 완료 대기 (최대 10분)
    let run = null;
    for (let i = 0; i < 60; i++) {
      await sleep(10000);
      const r = await gh(token, `/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5`);
      if (!r.ok) continue;
      run = ((await r.json()).workflow_runs || []).find(x => new Date(x.created_at).getTime() >= started - 60000);
      if (!run) continue;
      if (run.status !== 'completed') { setStatus(`수집 진행 중… (${Math.round((Date.now() - started) / 1000)}초 경과)`); continue; }
      break;
    }
    if (!run || run.status !== 'completed') throw new Error('수집이 10분 안에 끝나지 않았습니다. GitHub Actions 기록을 확인해 주세요.');
    if (run.conclusion !== 'success') throw new Error('수집이 실패했습니다. GitHub Actions 기록을 확인해 주세요.');
    // 2) 웹사이트 반영 대기 (최대 5분): index.js 의 수집 시각이 바뀌면 새로고침
    setBtn('반영 중…', true);
    setStatus('수집 완료! 웹사이트에 반영하는 중입니다 (1~2분).');
    for (let i = 0; i < 30; i++) {
      await sleep(10000);
      try {
        const txt = await (await fetch('data/index.js?v=' + Date.now(), { cache: 'no-store' })).text();
        const m = txt.match(/"collectedAt":"([^"]+)"/);
        if (m && m[1] !== prevStamp) { setStatus('반영 완료! 새로고침합니다.'); toast('최신 뉴스로 갱신되었습니다'); await sleep(1200); location.reload(); return; }
      } catch (e) {}
    }
    throw new Error('수집은 끝났지만 웹사이트 반영이 늦어지고 있습니다. 잠시 후 새로고침해 주세요.');
  } catch (e) {
    setStatus(e.message); toast(e.message);
  } finally {
    collecting = false; setBtn('뉴스 수집하기', false);
  }
}

if (REPO) {
  const btn = $('#collectNow');
  btn.hidden = false;
  document.body.insertAdjacentHTML('beforeend', `<dialog class="trig" id="trigDlg"><form method="dialog" id="trigForm">
    <h3>지금 뉴스 수집</h3><p class="note" style="margin:0">관리자 비밀번호를 입력하세요.</p>
    <input type="password" id="trigPw" autocomplete="off" placeholder="비밀번호">
    <div class="row"><button class="btn" value="cancel" type="submit" formnovalidate>닫기</button><button class="btn admin" id="trigGo" type="button">수집 실행</button></div>
    <p class="st" id="trigStatus"></p></form></dialog>`);
  const dlg = $('#trigDlg');
  btn.onclick = () => {
    // 토큰 설정 전에는 비밀번호를 묻지 않고 GitHub Actions 화면으로 바로 안내 (GitHub 로그인이 주인 확인 역할)
    if (!window.TRIGGER_KEY) {
      window.open(`https://github.com/${REPO.owner}/${REPO.repo}/actions/workflows/${WORKFLOW}`, '_blank', 'noopener');
      toast('GitHub 화면에서 Run workflow 를 누르면 수집됩니다');
      return;
    }
    if (!collecting) setStatus(''); $('#trigPw').value = ''; dlg.showModal(); $('#trigPw').focus();
  };
  const go = () => { if (collecting) return; const pw = $('#trigPw').value; $('#trigPw').value = ''; if (pw) runCollect(pw); };
  $('#trigGo').onclick = go;
  $('#trigPw').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
render();
</script>
